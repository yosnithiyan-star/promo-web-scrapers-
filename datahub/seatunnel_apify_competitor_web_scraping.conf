# Apify promo scrapers -> Hive (dev_thapbi_seamoney.apify_competitor_web_scraping)
#
# Flow — DataHub never waits for a scrape:
#   06:00 Asia/Bangkok (07:00 UTC+8)  Apify schedule "promo-datahub-daily" runs task `datahub` (~5 min).
#                                     Every run of the day (scheduled or manual re-run) appends to
#                                     the named dataset promos-YYYY-MM-DD (Bangkok date).
#   08:00 UTC+8 or later              this job reads that day's dataset — all runs combined — keeps
#                                     one row per promo id (latest scrape wins) and overwrites the
#                                     day's partition.
#
# If no run happened that day, the dataset does not exist: Apify returns 404 and this
# job FAILS (visible in DataHub) instead of loading nothing.
#
# Docs:
# - Full configuration guide: https://confluence.shopee.io/display/DI/Seatunnel+Flink+Config
# - Variable substitution: https://confluence.shopee.io/display/DI/Variable+Substitution+for+Config
# - HttpSource: https://confluence.shopee.io/pages/viewpage.action?pageId=1036570738

env {
  execution.parallelism = 1
  restart-strategy.type = "none"
}

source {
  HttpSource {
    datasource_name = "apify_competitor_web_scraping"
    url = "https://api.apify.com/v2/datasets/dashing_astronaut~promos-${bizTimeFormatter(BIZ_TIME,'yyyy-MM-dd')}/items?clean=true&token=${APIFY_API_TOKEN_MAIN}"
    method = "GET"
    http_response_code_as_success = [200]
    format = "json"
    retry = 2

    schema {
      id = string
      site = string
      post_id = string
      category = string
      category_slugs = array<string>
      title = string
      date_range = string
      date_start = string
      date_end = string
      link = string
      image = string
      published_at = string
      modified_at = string
      terms = string
      scraped_at = string
    }

    result_table_name = "apify_source"
  }
}

transform {
  Sql {
    # The day's dataset holds every run of that day, so a promo scraped by two
    # runs appears twice. ROW_NUMBER keeps the most recent scrape of each id.
    sql = """
      SELECT
          id,
          site,
          post_id,
          category,
          category_slugs,
          title,
          date_range,
          date_start,
          date_end,
          link,
          image,
          CASE
              WHEN published_at IS NULL OR TRIM(published_at) = '' THEN '1977-01-01 00:00:00'
              ELSE published_at
          END AS published_at,
          CASE
              WHEN modified_at IS NULL OR TRIM(modified_at) = '' THEN '1977-01-01 00:00:00'
              ELSE modified_at
          END AS modified_at,
          terms,
          scraped_at,
          '${bizTimeFormatter(BIZ_TIME,'yyyy-MM-dd')}' AS grass_date
      FROM (
          SELECT
              *,
              ROW_NUMBER() OVER (PARTITION BY id ORDER BY scraped_at DESC) AS rn
          FROM apify_source
      ) t
      WHERE rn = 1
    """
    result_table_name = "apify_transformed"
  }
}

sink {
  HiveSink {
    source_table_name = "apify_transformed"
    result_table_name = "hive.dev_thapbi_seamoney.apify_competitor_web_scraping"
    create_table_enabled = true
    # Overwrite: re-running a day replaces that day's partition with the
    # combined, de-duplicated data of all that day's runs.
    overwrite = true
    partition_schema {
      grass_date = string
    }
  }
}
